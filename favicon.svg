<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tic Tac Toe Arena icon: a small board with an X and an O,
       in the Classic theme's X and O colours (see styles.css). -->
  <rect width="64" height="64" rx="14" fill="#ffffff"/>
  <g stroke="#c5cde0" stroke-width="3" stroke-linecap="round">
    <line x1="25" y1="10" x2="25" y2="54"/>
    <line x1="39" y1="10" x2="39" y2="54"/>
    <line x1="10" y1="25" x2="54" y2="25"/>
    <line x1="10" y1="39" x2="54" y2="39"/>
  </g>
  <g stroke="#4f6df5" stroke-width="5" stroke-linecap="round">
    <line x1="11" y1="11" x2="21" y2="21"/>
    <line x1="21" y1="11" x2="11" y2="21"/>
  </g>
  <circle cx="32" cy="32" r="5.5" fill="none" stroke="#e0567a" stroke-width="4.5"/>
  <g stroke="#4f6df5" stroke-width="5" stroke-linecap="round">
    <line x1="43" y1="43" x2="53" y2="53"/>
    <line x1="53" y1="43" x2="43" y2="53"/>
  </g>
</svg>
